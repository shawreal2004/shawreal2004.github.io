<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img" aria-labelledby="title desc">
<title id="title">混合VR图片数据库和算法：研一上学期路线</title>
<desc id="desc">六个阶段由任务与基础推进至数据试验集、主观预实验、数据库整理、算法基线和学期复盘。数据和算法相互反馈。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#61786b"/></marker></defs>
