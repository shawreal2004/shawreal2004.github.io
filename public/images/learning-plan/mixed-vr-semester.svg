<text x="36" y="77" font-size="15" fill="#706c61">先定义问题，再做可靠数据与可检查的算法</text>
<rect x="36" y="102" width="274" height="62" rx="13" fill="#e1e9dc"/>
<text x="53" y="128" font-size="17" font-weight="700">UGC · 真实采集</text><text x="53" y="151" font-size="13">来源、拼接、曝光与压缩等</text>
<rect x="330" y="102" width="274" height="62" rx="13" fill="#f0dfd1"/>
<text x="347" y="128" font-size="17" font-weight="700">AIGC · AI 生成</text><text x="347" y="151" font-size="13">来源、生成伪影与空间合理性</text>
<g stroke="#61786b" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M173 165V180H318V193"/><path d="M467 165V180H326V193"/>
<path d="M320 273V289"/><path d="M320 369V385"/><path d="M320 465V481"/><path d="M320 561V577"/><path d="M320 657V673"/>
