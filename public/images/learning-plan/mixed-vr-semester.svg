<g fill="#fffdf8" stroke="#d9ded1"><rect x="36" y="196" width="568" height="77" rx="13"/><rect x="36" y="292" width="568" height="77" rx="13"/><rect x="36" y="388" width="568" height="77" rx="13"/><rect x="36" y="484" width="568" height="77" rx="13"/><rect x="36" y="580" width="568" height="77" rx="13"/><rect x="36" y="676" width="568" height="77" rx="13"/></g>
<g font-size="18" font-weight="700"><text x="55" y="226">01  任务定义与最小基础</text><text x="55" y="322">02  数据试验集与来源检查</text><text x="55" y="418">03  VR 主观评价预实验</text><text x="55" y="514">04  数据库整理与内容分组</text><text x="55" y="610">05  算法基线与分来源评测</text><text x="55" y="706">06  对照、消融与学期复盘</text></g>
<g font-size="14" fill="#706c61"><text x="55" y="252">产出：一页任务定义 + 最小数据与训练闭环</text><text x="55" y="348">产出：样本清单 + 元数据 + 失真与接缝样例</text><text x="55" y="444">产出：评分协议 + 试评记录 + 可靠性检查</text><text x="55" y="540">产出：真实标签 + 数据版本 + 无泄漏划分</text><text x="55" y="636">产出：普通 IQA / 视口 / 视觉语言基线与失败分析</text><text x="55" y="732">产出：一项可验证改进 + 学期报告 + 下一步问题</text></g>
<text x="36" y="791" font-size="15" font-weight="700">数据库与算法并行推进，阶段可根据反馈回退</text>
<text x="36" y="821" font-size="13" fill="#706c61">这是待执行路线；各阶段按实际产出验收，不固定每周工时。</text>
