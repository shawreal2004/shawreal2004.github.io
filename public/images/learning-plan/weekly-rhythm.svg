<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">每周10小时的建议分配</title>
  <desc id="desc">每周基础安排为阅读和概念3小时，代码实践4小时，结果分析2小时，记录和汇报1小时；另有0至2小时弹性时间，繁忙周采用6小时保底安排。</desc>
  <rect width="640" height="420" rx="22" fill="#f1eee5"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="32" y="49" font-size="17" letter-spacing="2" fill="#60755c">A STEADY WEEK</text>
    <text x="32" y="96" font-size="30" font-weight="600" fill="#30372e">每周 10 小时，留出稳定节奏</text>
    <g><rect x="32" y="126" width="173" height="58" fill="#d9e3ca"/><rect x="205" y="126" width="230" height="58" fill="#60755c"/><rect x="435" y="126" width="115" height="58" fill="#dfb49b"/><rect x="550" y="126" width="58" height="58" fill="#d9d4c8"/></g>
    <g font-size="23" font-weight="600" text-anchor="middle"><text x="118" y="165" fill="#30372e">3h</text><text x="320" y="165" fill="#fffdf8">4h</text><text x="493" y="165" fill="#30372e">2h</text><text x="579" y="165" fill="#30372e">1h</text></g>
    <g font-size="22" fill="#30372e"><circle cx="43" cy="227" r="7" fill="#a6ba91"/><text x="62" y="235">阅读与概念 · 3 小时</text><circle cx="348" cy="227" r="7" fill="#60755c"/><text x="366" y="235">代码实践 · 4 小时</text><circle cx="43" cy="280" r="7" fill="#dfb49b"/><text x="62" y="288">结果分析 · 2 小时</text><circle cx="348" cy="280" r="7" fill="#c2b9a4"/><text x="366" y="288">记录汇报 · 1 小时</text></g>
    <path d="M32 319H608" stroke="#d0d4c6"/>
    <text x="32" y="354" font-size="21" fill="#626e5d">另留 0–2 小时弹性：补基础、排错或休息。</text>
    <text x="32" y="392" font-size="21" fill="#95664f">繁忙周：6 小时保底，优先保留核心产出。</text>
  </g>
</svg>
