<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
  <title id="title">混合 VR 图像质量评价知识地图</title>
  <desc id="desc">数学与数字图像支撑张量、训练、视觉特征和球面视口。数据库的来源与主观标签和算法在内容分组及可靠评测处汇合。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#657c66" stroke-width="1.5"/></marker></defs>
  <rect width="640" height="900" rx="18" fill="#f7f4ed"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="36" y="42" font-size="12" letter-spacing="2" fill="#8b7868">FOUNDATIONS · KNOWLEDGE MAP</text>
    <text x="36" y="78" font-size="25" font-weight="bold" fill="#344a3b">我的前置知识地图</text>
    <text x="36" y="107" font-size="14" fill="#687268">我的课题：AIGC 与 UGC 混合的 360° 全景静态图片</text>
    <rect x="36" y="135" width="568" height="106" rx="12" fill="#fffdf8" stroke="#ddd9cd"/>
