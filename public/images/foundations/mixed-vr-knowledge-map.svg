    <text x="58" y="198" font-size="14" fill="#59645a">矩阵 · 梯度 · 统计 · 采样 · 颜色与预处理</text>
    <text x="58" y="220" font-size="13" fill="#7d8277">能解释数据形状、误差与信息损失</text>
    <path d="M320 244V268" stroke="#657c66" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="36" y="280" width="568" height="106" rx="12" fill="#edf1e7" stroke="#d0d9c9"/>
    <text x="58" y="315" font-size="18" font-weight="bold" fill="#344a3b">02  Python / PyTorch 与训练闭环</text>
    <text x="58" y="343" font-size="14" fill="#59645a">Dataset → Batch → Forward → Loss → Backward</text>
    <text x="58" y="365" font-size="13" fill="#7d8277">能定位输入、维度、设备和标签问题</text>
    <path d="M320 389V408" fill="none" stroke="#657c66" stroke-width="2"/>
    <path d="M320 408H174V426" fill="none" stroke="#657c66" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M320 408H466V426" fill="none" stroke="#657c66" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="36" y="440" width="272" height="155" rx="12" fill="#fffdf8" stroke="#ddd9cd"/>
    <text x="56" y="474" font-size="18" font-weight="bold" fill="#344a3b">数据库这条线</text>
    <text x="56" y="505" font-size="14" fill="#59645a">来源 · 内容关系 · 元数据</text>
    <text x="56" y="534" font-size="14" fill="#59645a">主观协议 · MOS · 不确定性</text>
    <text x="56" y="570" font-size="13" fill="#7d8277">回答：分数从哪里来？</text>
    <rect x="332" y="440" width="272" height="155" rx="12" fill="#fffdf8" stroke="#ddd9cd"/>
    <text x="352" y="474" font-size="18" font-weight="bold" fill="#344a3b">算法这条线</text>
    <text x="352" y="505" font-size="14" fill="#59645a">CNN / ViT · 预训练特征</text>
    <text x="352" y="534" font-size="14" fill="#59645a">球面视口 · 采样 · 聚合</text>
    <text x="352" y="570" font-size="13" fill="#7d8277">回答：图片怎样变成预测？</text>
    <path d="M172 600V621H320M468 600V621H320V647" fill="none" stroke="#657c66" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="36" y="660" width="568" height="119" rx="12" fill="#dce5d5" stroke="#bac9b1"/>
    <text x="58" y="695" font-size="18" font-weight="bold" fill="#344a3b">03  内容分组与可靠评测</text>
